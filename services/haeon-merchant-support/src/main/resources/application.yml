server:
  port: ${SERVER_PORT:8091}
  shutdown: graceful
spring:
  application:
    name: haeon-merchant-support
  datasource:
    url: jdbc:mysql://${DB_HOST:haeon-card-mysql}:3306/${DB_NAME:haeon_card}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&serverTimezone=UTC
    username: ${DB_USER:haeon_app}
    password: ${DB_PASSWORD:haeon_app_lab_only}
    hikari:
      maximum-pool-size: 4
      connection-timeout: 2000
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
lab:
  control-token: ${LAB_CONTROL_TOKEN:lab-control-token-2026}
  receiver-url: ${LAB_RECEIVER_URL:http://haeon-lab-receiver:8093/v1/ingest}
