<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>가맹점 지원 · 해온카드 가상 실습</title>
<style>
body{margin:0;background:#f4f8f6;color:#20332d;font-family:system-ui,"Noto Sans KR",sans-serif}main{max-width:760px;margin:48px auto;padding:0 20px}.card{background:#fff;border:1px solid #dce8e2;border-radius:16px;padding:28px;box-shadow:0 12px 30px #173d2b10}h1{margin:0 0 8px;font-size:26px}p{color:#63756d;font-size:13px}.grid{display:grid;gap:10px;margin-top:20px}label{font-size:12px;color:#63756d}input,select,button{font:inherit;padding:11px 12px;border-radius:8px;border:1px solid #cddbd4}button{background:#0b7f70;color:#fff;border:0;cursor:pointer}button.secondary{background:#eaf4ef;color:#146d5f}.result{margin-top:18px;background:#10251f;color:#d9fff0;border-radius:10px;padding:16px;white-space:pre-wrap;min-height:100px}.tag{display:inline-block;background:#e8f5ef;color:#14715f;padding:4px 8px;border-radius:16px;font-size:11px}.warning{background:#fff6df;color:#81631d;padding:10px;border-radius:8px;font-size:12px;margin-top:12px}.hidden{display:none}
</style></head>
<body><main><div class="card"><span class="tag">가상 부트캠프 실습 · 실제 서비스 아님</span><h1>결제 연동 상태 진단</h1><p>해온카드 합성 가맹점 지원 화면입니다. 외부 주소나 실제 PG를 호출하지 않습니다.</p>
<section id="login"><div class="grid"><label for="loginId">가맹점 아이디</label><input id="loginId" value="labmart" autocomplete="username"><label for="password">비밀번호</label><input id="password" type="password" value="LabMart!2026" autocomplete="current-password"><button id="loginButton">가맹점 로그인</button></div></section>
<section id="diagnostic" class="hidden"><div class="grid"><label for="target">진단 대상</label><select id="target"></select><button id="runButton">정상 연결 진단</button><button class="secondary" id="logoutButton">로그아웃</button></div><div class="warning">모의 침해 단계는 별도 제어 도구에서 실행합니다. 이 화면은 정상 업무 진단만 제공합니다.</div></section>
<pre class="result" id="result" aria-live="polite">로그인하면 진단 대상이 표시됩니다.</pre></div></main>
<script>
(()=>{const $=id=>document.getElementById(id);let token='';const print=x=>{$('result').textContent=typeof x==='string'?x:JSON.stringify(x,null,2)};const call=async(path,options={})=>{const headers={'Accept':'application/json',...(options.headers||{})};if(token)headers.Authorization=`Bearer ${token}`;if(options.body)headers['Content-Type']='application/json';const r=await fetch(path,{...options,headers});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.message||`HTTP ${r.status}`);return b};
  $('loginButton').onclick=async()=>{try{const b=await call('/merchant/v1/sessions',{method:'POST',body:JSON.stringify({loginId:$('loginId').value,password:$('password').value})});token=b.sessionToken;$('login').classList.add('hidden');$('diagnostic').classList.remove('hidden');const targets=await call('/merchant/v1/diagnostic-targets');$('target').replaceChildren(...targets.map(t=>new Option(t.displayName,t.targetId)));print({login:'SUCCESS',merchantNo:b.merchantNo,targets:targets.length,simulation:true})}catch(e){print({error:e.message})}};
  $('runButton').onclick=async()=>{try{print(await call('/merchant/v1/diagnostics/connectivity',{method:'POST',body:JSON.stringify({targetId:$('target').value,option:'status'})}))}catch(e){print({error:e.message})}};
  $('logoutButton').onclick=async()=>{await call('/merchant/v1/sessions',{method:'DELETE'}).catch(()=>{});token='';$('login').classList.remove('hidden');$('diagnostic').classList.add('hidden');print('로그아웃되었습니다.')};
})();
</script></body></html>
