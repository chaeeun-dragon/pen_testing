server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

spring:
  application:
    name: haeon-card
  lifecycle:
    timeout-per-shutdown-phase: 10s
  datasource:
    url: jdbc:mysql://${DB_HOST:haeon-card-mysql}:3306/${DB_NAME:haeon_card}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&serverTimezone=UTC
    username: ${DB_USER:haeon_app}
    password: ${DB_PASSWORD:haeon_app_lab_only}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:4}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:2000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:1000}
      transaction-isolation: TRANSACTION_READ_COMMITTED

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

haeon-card:
  lab-profile: ${LAB_PROFILE:normal}
  instance-id: ${HAEON_CARD_INSTANCE_ID:haeon-card-1}
  merchant-no: ${HAEON_MERCHANT_NO:BOOKWAVE-LAB}
  merchant-token: ${HAEON_MERCHANT_TOKEN:lab-merchant-bookwave}
  before-barrier-enabled: ${BEFORE_BARRIER_ENABLED:false}
  barrier-timeout-seconds: ${BARRIER_TIMEOUT_SECONDS:5}

logging:
  pattern:
    level: "%5p [corr=%X{correlationId}]"
