events {}
http {
  server {
    listen 8090;
    server_name haeon.localhost _;
    location /merchant/ { proxy_pass http://haeon-merchant-support:8091; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /lab-shell/ { proxy_pass http://haeon-merchant-support:8091; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location / { proxy_pass http://haeon-card:8085; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  }
}
