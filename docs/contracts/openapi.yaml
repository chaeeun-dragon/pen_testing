openapi: 3.0.3
info:
  title: Bookwave - Mock PG - Haeon Card Lab API
  version: 0.1.0
  description: |
    합성 데이터만 사용하는 격리형 실습 환경의 API 계약이다.
    실제 결제망이나 실제 카드정보를 연결하지 않는다.
servers:
  - url: http://localhost:8080
    description: bookwave-app (host local)
tags:
  - name: Bookwave
    description: 북웨이브 외부 결제 접수
  - name: Mock PG
    description: 북웨이브와 해온카드 사이의 결제 전달
  - name: Haeon Card
    description: 카드 승인·한도 판단
  - name: Haeon Card Portal
    description: 해온카드 회원 조회(마이페이지). 조회 전용이며 승인 상태를 바꾸지 않는다.
  - name: Health
    description: 서비스 상태 확인
paths:
  /api/v1/payments:
    post:
      tags: [Bookwave]
      summary: 결제 접수
      description: 북웨이브가 결제를 접수하고 Mock PG에 전달한다.
      operationId: createPayment
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
            example:
              correlationId: corr-20260909-0001
              orderNo: BW-ORDER-0001
              merchantRequestId: BW-REQ-0001
              amount: 10000
              currency: KRW
              paymentMethodToken: card-token-lab-001
      responses:
        '200':
          description: 승인 또는 정상 거절
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /internal/v1/pg/charges:
    post:
      tags: [Mock PG]
      summary: PG 거래 생성과 승인 전달
      description: bookwave-app만 호출하며, Mock PG가 가맹점 정보와 PG 거래 ID를 만든다.
      operationId: createPgCharge
      servers:
        - url: http://localhost:8083
          description: mock-pg (host local)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PgChargeRequest'
      responses:
        '200':
          description: 카드 승인 결과를 PG 형태로 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/MerchantNotAllowed'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /internal/v1/authorizations:
    post:
      tags: [Haeon Card]
      summary: 카드 승인 요청
      description: Mock PG가 호출하며 해온카드가 최신 한도와 잠금 결과로 승인 여부를 결정한다.
      operationId: authorizeCard
      servers:
        - url: http://localhost:8084
          description: haeon-card (compose.debug.yaml에서만 호스트 로컬에 게시)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/MerchantAuthorization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationRequest'
            example:
              correlationId: corr-20260909-0001
              merchantNo: BOOKWAVE-LAB
              merchantRequestId: BW-REQ-0001
              cardToken: card-token-lab-001
              amount: 10000
              currency: KRW
              requestFingerprint: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
              requestedAt: '2026-09-09T05:00:00Z'
      responses:
        '200':
          description: 승인 또는 정상 거절
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/MerchantNotAllowed'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/BeforeBarrierTimeout'

  /portal/v1/sessions:
    post:
      tags: [Haeon Card Portal]
      summary: 회원 로그인
      description: 합성 회원 자격으로 로그인하고 조회용 세션 토큰을 받는다.
      operationId: createPortalSession
      servers:
        - url: http://localhost:8085
          description: haeon-card 회원 포털 커넥터
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalLoginRequest'
            example:
              loginId: haeon01
              password: Haeon!2026
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalLoginResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/PortalUnauthorized'
    delete:
      tags: [Haeon Card Portal]
      summary: 로그아웃
      description: 세션 토큰을 즉시 무효화한다. 토큰이 이미 없으면 그대로 성공 처리한다.
      operationId: deletePortalSession
      servers:
        - url: http://localhost:8085
      parameters:
        - $ref: '#/components/parameters/PortalAuthorization'
      responses:
        '204':
          description: 로그아웃 완료

  /portal/v1/me:
    get:
      tags: [Haeon Card Portal]
      summary: 내 회원 정보 조회
      operationId: getPortalMember
      servers:
        - url: http://localhost:8085
      parameters:
        - $ref: '#/components/parameters/PortalAuthorization'
      responses:
        '200':
          description: 로그인한 회원의 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalMember'
        '401':
          $ref: '#/components/responses/PortalUnauthorized'

  /portal/v1/me/cards:
    get:
      tags: [Haeon Card Portal]
      summary: 내 카드 한도 조회
      description: |
        로그인 세션의 회원에 연결된 카드만 돌려준다. 요청으로 회원·카드를 고를 수 없다.
        card_limits.version은 CARD-03 증거·운영 확인용이므로 이 응답에 넣지 않는다.
      operationId: getPortalCards
      servers:
        - url: http://localhost:8085
      parameters:
        - $ref: '#/components/parameters/PortalAuthorization'
      responses:
        '200':
          description: 보유 카드와 이용한도·사용액·잔여한도
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalCardList'
        '401':
          $ref: '#/components/responses/PortalUnauthorized'

  /portal/v1/me/transactions:
    get:
      tags: [Haeon Card Portal]
      summary: 내 거래내역 조회
      description: 로그인 회원의 카드로 확정된 승인·거절 내역을 최근 순으로 돌려준다.
      operationId: getPortalTransactions
      servers:
        - url: http://localhost:8085
      parameters:
        - $ref: '#/components/parameters/PortalAuthorization'
        - name: limit
          in: query
          required: false
          description: 조회 건수. 기본 20, 최대 100으로 잘린다.
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        '200':
          description: 최근 승인·거절 내역과 합계
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalTransactionList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/PortalUnauthorized'

  /actuator/health:
    get:
      tags: [Health]
      summary: 서비스 상태 확인
      operationId: getHealth
      responses:
        '200':
          description: 서비스와 필수 의존성이 정상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: 서비스 또는 DB가 준비되지 않음

components:
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      description: 세 서비스 로그를 한 결제 왕복으로 묶는 ID
      schema:
        type: string
        minLength: 8
        maxLength: 80
        pattern: '^[A-Za-z0-9_-]+$'
      example: corr-20260909-0001
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 같은 요청의 재시도를 하나로 묶는 키. merchantRequestId와 같은 값이어야 한다.
      schema:
        type: string
        minLength: 1
        maxLength: 80
        pattern: '^[A-Za-z0-9_-]+$'
      example: BW-REQ-0001
    PortalAuthorization:
      name: Authorization
      in: header
      required: true
      description: 로그인으로 받은 회원 세션 토큰
      schema:
        type: string
        pattern: '^Bearer [A-Za-z0-9_-]+$'
      example: Bearer 3nS1p0rTaL-synthetic-session-token
    MerchantAuthorization:
      name: Authorization
      in: header
      required: false
      description: 합성 가맹점 Bearer 인증. 현재 v0.1 호환을 위해 생략 시 merchantNo 본문을 사용한다.
      schema:
        type: string
        pattern: '^Bearer lab-merchant-bookwave$'
      example: Bearer lab-merchant-bookwave

  schemas:
    PortalLoginRequest:
      type: object
      required: [loginId, password]
      additionalProperties: false
      properties:
        loginId:
          type: string
          maxLength: 40
          pattern: '^[A-Za-z0-9_.-]{1,40}$'
          example: haeon01
        password:
          type: string
          maxLength: 100
          description: 합성 회원 비밀번호. 로그·증거 파일에 남기지 않는다.
    PortalLoginResponse:
      type: object
      required: [sessionToken, expiresAt, member]
      properties:
        sessionToken:
          type: string
          description: 이후 조회 요청의 Bearer 토큰. 서버는 해시만 저장한다.
        expiresAt:
          type: string
          format: date-time
        member:
          $ref: '#/components/schemas/PortalMember'
    PortalMember:
      type: object
      required: [memberNo, displayName, joinedAt, cardCount]
      properties:
        memberNo:
          type: string
          example: HC-MEMBER-001
        displayName:
          type: string
          example: 김해온
        joinedAt:
          type: string
          format: date-time
        cardCount:
          type: integer
          example: 3
    PortalCard:
      type: object
      required: [maskedNumber, cardName, brand, cardType, paymentDay, primary, status,
                 limitAmount, usedAmount, remainingAmount]
      properties:
        maskedNumber:
          type: string
          example: '**** **** **** 0001'
        cardName:
          type: string
          example: 해온 플러스
        brand:
          type: string
          example: Mastercard
        cardType:
          type: string
          example: 신용
        paymentDay:
          type: integer
          minimum: 1
          maximum: 28
          example: 25
        benefitSummary:
          type: string
        primary:
          type: boolean
          description: 회원의 주 이용 카드 여부
        status:
          type: string
          enum: [NORMAL, SUSPENDED, LOST, EXPIRED]
        limitAmount:
          type: integer
          example: 100000
        usedAmount:
          type: integer
          example: 30000
        remainingAmount:
          type: integer
          description: limitAmount - usedAmount. 음수가 되지 않도록 0에서 멈춘다.
          example: 70000
    PortalCardList:
      type: object
      required: [member, cards, totalLimitAmount, totalUsedAmount, totalRemainingAmount]
      properties:
        member:
          $ref: '#/components/schemas/PortalMember'
        cards:
          type: array
          items:
            $ref: '#/components/schemas/PortalCard'
        totalLimitAmount:
          type: integer
        totalUsedAmount:
          type: integer
        totalRemainingAmount:
          type: integer
    PortalTransaction:
      type: object
      required: [authorizationNo, occurredAt, merchantName, cardName, maskedNumber, amount, status]
      properties:
        authorizationNo:
          type: string
          example: AUTH-HC-0f2a91c3d8b47e15
        occurredAt:
          type: string
          format: date-time
        merchantName:
          type: string
          example: 북웨이브
        cardName:
          type: string
          example: 해온 플러스
        maskedNumber:
          type: string
          example: '**** 0001'
        amount:
          type: integer
          example: 21000
        status:
          type: string
          enum: [APPROVED, DECLINED]
        reasonCode:
          type: string
          enum: [APPROVED, LIMIT_EXCEEDED, CARD_BLOCKED]
    PortalTransactionList:
      type: object
      required: [member, transactions, approvedCount, approvedAmount, declinedCount]
      properties:
        member:
          $ref: '#/components/schemas/PortalMember'
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/PortalTransaction'
        approvedCount:
          type: integer
        approvedAmount:
          type: integer
        declinedCount:
          type: integer
    PaymentRequest:
      type: object
      required: [correlationId, orderNo, merchantRequestId, amount, currency, paymentMethodToken]
      additionalProperties: false
      properties:
        correlationId:
          type: string
          example: corr-20260909-0001
        orderNo:
          type: string
          example: BW-ORDER-0001
        merchantRequestId:
          type: string
          example: BW-REQ-0001
        amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000000
          example: 10000
        currency:
          type: string
          enum: [KRW]
        paymentMethodToken:
          type: string
          pattern: '^card-token-lab-[A-Za-z0-9_-]+$'

    PgChargeRequest:
      allOf:
        - $ref: '#/components/schemas/PaymentRequest'

    AuthorizationRequest:
      type: object
      required: [correlationId, merchantNo, merchantRequestId, cardToken, amount, currency, requestFingerprint, requestedAt]
      additionalProperties: false
      properties:
        correlationId:
          type: string
          minLength: 8
          maxLength: 80
          pattern: '^[A-Za-z0-9_-]+$'
          example: corr-20260909-0001
        merchantNo:
          type: string
          maxLength: 40
          pattern: '^[A-Za-z0-9_-]+$'
          example: BOOKWAVE-LAB
          description: Mock PG가 서버 설정으로 선택한 합성 가맹점 번호. 해온카드가 허용 목록과 비교한 뒤 내부 merchant_id로 매핑한다.
        merchantRequestId:
          type: string
          maxLength: 80
          pattern: '^[A-Za-z0-9_-]+$'
          example: BW-REQ-0001
        cardToken:
          type: string
          maxLength: 80
          pattern: '^card-token-lab-[A-Za-z0-9_-]+$'
        amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000000
          example: 10000
        currency:
          type: string
          enum: [KRW]
        requestFingerprint:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: 요청 본문의 정규화 값으로 만든 SHA-256 hex
        requestedAt:
          type: string
          format: date-time
        decision:
          type: string
          deprecated: true
          description: 요청에 포함하지 않는다. 포함되어도 해온카드는 무시한다.
          readOnly: true

    PaymentResult:
      type: object
      required: [correlationId, orderNo, paymentId, pgTid, decision, approvedAmount]
      additionalProperties: false
      properties:
        correlationId:
          type: string
        orderNo:
          type: string
        paymentId:
          type: string
          example: PAY-LAB-0001
        pgTid:
          type: string
          example: PG-LAB-0001
        decision:
          $ref: '#/components/schemas/Decision'
        approvedAmount:
          type: integer
          format: int64
          minimum: 0
        authorizationNo:
          type: string
          example: AUTH-LAB-0001
        reasonCode:
          type: string
          example: APPROVED

    AuthorizationResult:
      type: object
      required: [correlationId, authorizationId, decision, approvedAmount, reasonCode]
      additionalProperties: false
      properties:
        correlationId:
          type: string
        authorizationId:
          type: integer
          format: int64
          example: 1
        authorizationNo:
          type: string
          example: AUTH-LAB-0001
        decision:
          $ref: '#/components/schemas/Decision'
        approvedAmount:
          type: integer
          format: int64
          minimum: 0
        remainingLimit:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          description: 카드 내부 실습 증거용. 북웨이브 응답에는 전달하지 않는다.
        reasonCode:
          type: string
          example: APPROVED

    Decision:
      type: string
      enum: [APPROVED, DECLINED, DUPLICATE, MISMATCH_QUARANTINED]

    ErrorResponse:
      type: object
      required: [correlationId, errorCode, message, retryable]
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errorCode:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: 필수값이 누락되었습니다.
        retryable:
          type: boolean
          example: false

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP]
        service:
          type: string
          example: haeon-card
        profile:
          type: string
          example: normal
        beforeBarrierEnabled:
          type: boolean
          example: false

  responses:
    PortalUnauthorized:
      description: |
        로그인이 필요하거나 세션이 만료됨(SESSION_REQUIRED),
        또는 아이디·비밀번호가 올바르지 않음(INVALID_CREDENTIALS).
        두 실패는 계정 존재 여부를 흘리지 않도록 같은 본문을 돌려준다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidRequest:
      description: 요청 형식 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MerchantNotAllowed:
      description: 허용되지 않은 가맹점
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdempotencyConflict:
      description: 같은 요청 키에 다른 내용이 사용됨
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UpstreamError:
      description: 다음 서비스의 응답 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UpstreamUnavailable:
      description: 다음 서비스 연결 불가
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 예상하지 못한 내부 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BeforeBarrierTimeout:
      description: Before 동시성 실습의 짝 요청이 제한 시간 안에 도착하지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
