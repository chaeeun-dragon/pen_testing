name: bookwave-haeon-lab

# 이 파일은 실행 가능한 환경 기준선이다.
# bookwave-app, mock-pg, haeon-card는 Java 21 + Spring Boot 뼈대이며,
# 챗봇·표지 업로드 서비스는 실제 실습 이미지로 교체하기 전의 대기 상태다.
# 실제 결제·금융망과 외부 공격 대상은 연결하지 않는다.

services:
  bookwave-app:
    build:
      context: ./services/bookwave-app
    image: bookwave/bookwave-app:lab
    restart: unless-stopped
    environment:
      SERVICE_NAME: bookwave-app
      LAB_PROFILE: ${LAB_PROFILE:-normal}
      MOCK_PG_BASE_URL: http://mock-pg:8083
      INCIDENT_SIMULATION_ENABLED: ${INCIDENT_SIMULATION_ENABLED:-false}
      INCIDENT_SIMULATION_ACCESS_TOKEN: ${INCIDENT_SIMULATION_ACCESS_TOKEN:-}
    ports:
      - "127.0.0.1:${BOOKWAVE_APP_PORT:-8080}:8080"
    networks:
      - front_net
      - dmz_net
      - bookwave_db_net
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/service-ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      lab.role: "bookwave-client-api"
      lab.note: "Java/Spring payment entry skeleton; add order persistence later"

  bookwave-chatbot:
    image: eclipse-temurin:21-jre
    restart: unless-stopped
    command: ["sh", "-c", "touch /tmp/service-ready; while :; do sleep 3600; done"]
    environment:
      SERVICE_NAME: bookwave-chatbot
      LAB_PROFILE: ${LAB_PROFILE:-normal}
      COVER_UPLOAD_BASE_URL: http://bookwave-cover-upload:8082
    expose:
      - "8081"
    networks:
      - dmz_net
      - bookwave_db_net
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/service-ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      lab.role: "bookwave-chatbot"
      lab.note: "SCN-05A entry surface; keep chatbot and cover service as separate containers"

  bookwave-cover-upload:
    image: eclipse-temurin:21-jre
    restart: unless-stopped
    command: ["sh", "-c", "touch /tmp/service-ready; while :; do sleep 3600; done"]
    environment:
      SERVICE_NAME: bookwave-cover-upload
      LAB_PROFILE: ${LAB_PROFILE:-normal}
      COVER_UPLOAD_RUNTIME: ${COVER_UPLOAD_RUNTIME:-java-spring}
    expose:
      - "8082"
    networks:
      - dmz_net
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/service-ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      lab.role: "bookwave-cover-and-upload"
      lab.note: "Optional isolated Apache/PHP image may replace this image for SCN-05B"

  mock-pg:
    build:
      context: ./services/mock-pg
    image: bookwave/mock-pg:lab
    restart: unless-stopped
    environment:
      SERVICE_NAME: mock-pg
      LAB_PROFILE: ${LAB_PROFILE:-normal}
      HAEON_CARD_BASE_URL: http://haeon-card:8084
      MOCK_PG_MERCHANT_NO: BOOKWAVE-LAB
      HAEON_MERCHANT_TOKEN: ${HAEON_MERCHANT_TOKEN:-lab-merchant-bookwave}
      ERROR_INJECTION_ENABLED: ${ERROR_INJECTION_ENABLED:-false}
    ports:
      - "127.0.0.1:${MOCK_PG_PORT:-8083}:8083"
    networks:
      - dmz_net
      - card_net
      - audit_net
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/service-ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      lab.role: "od-02-x-trust-boundary"
      lab.note: "Only this adapter may call haeon-card in the normal architecture"

  haeon-card:
    build:
      context: ./services/haeon-card
    image: bookwave/haeon-card:lab
    restart: unless-stopped
    environment:
      SERVICE_NAME: haeon-card
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-lab}
      SERVER_PORT: 8084
      DB_HOST: haeon-card-mysql
      DB_NAME: ${HAEON_DB_NAME:-haeon_card}
      DB_USER: ${HAEON_DB_USER:-haeon_app}
      DB_PASSWORD: ${HAEON_DB_PASSWORD:-haeon_app_lab_only}
      DB_POOL_MAX: ${HAEON_DB_POOL_MAX:-4}
      DB_POOL_MIN: ${HAEON_DB_POOL_MIN:-2}
      HAEON_MERCHANT_NO: ${HAEON_MERCHANT_NO:-BOOKWAVE-LAB}
      HAEON_MERCHANT_TOKEN: ${HAEON_MERCHANT_TOKEN:-lab-merchant-bookwave}
      PORTAL_PORT: 8085
      PORTAL_SESSION_TTL_MINUTES: ${HAEON_PORTAL_SESSION_TTL_MINUTES:-30}
    # 승인 API(8084)는 card_net/audit_net 내부 전용이다. mock-pg만 호출한다.
    # 회원 포털(8085)만 호스트에 공개하며, 포트별 경로 제한은 애플리케이션이 강제한다.
    # 8084를 직접 확인해야 할 때만 compose.debug.yaml을 함께 사용한다.
    depends_on:
      haeon-card-mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HAEON_PORTAL_PORT:-8085}:8085"
    networks:
      - card_net
      - audit_net
      - card_portal_net
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/service-ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      lab.role: "card-approval-core-and-member-portal"
      lab.note: "Card approval API on 8084 (mock-pg only); member portal on 8085"

  haeon-card-mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${HAEON_DB_ROOT_PASSWORD:-root_lab_only}
      MYSQL_DATABASE: ${HAEON_DB_NAME:-haeon_card}
      MYSQL_USER: ${HAEON_DB_USER:-haeon_app}
      MYSQL_PASSWORD: ${HAEON_DB_PASSWORD:-haeon_app_lab_only}
      TZ: UTC
    volumes:
      - haeon_card_mysql_data:/var/lib/mysql
      - ./db/haeon-card/init/001_haeon_card_schema.sql:/docker-entrypoint-initdb.d/001_haeon_card.sql:ro
      - ./db/haeon-card/fixtures/002_haeon_payment_seed.sql:/docker-entrypoint-initdb.d/002_haeon_payment_seed.sql:ro
      - ./db/haeon-card/fixtures/003_haeon_payment_baseline.sql:/docker-entrypoint-initdb.d/003_haeon_payment_baseline.sql:ro
      - ./db/haeon-card/init/004_portal_schema.sql:/docker-entrypoint-initdb.d/004_portal_schema.sql:ro
      - ./db/haeon-card/fixtures/006_portal_seed.sql:/docker-entrypoint-initdb.d/006_portal_seed.sql:ro
      - ./db/haeon-card/fixtures/007_portal_history_seed.sql:/docker-entrypoint-initdb.d/007_portal_history_seed.sql:ro
      - ./db/haeon-card/init/009_lab_diagnostic_schema.sql:/docker-entrypoint-initdb.d/009_lab_diagnostic_schema.sql:ro
      - ./db/haeon-card/fixtures/009_lab_diagnostic_seed.sql:/docker-entrypoint-initdb.d/009_lab_diagnostic_seed.sql:ro
      - ./db/haeon-card/init/010_lab_support_grants.sql:/docker-entrypoint-initdb.d/010_lab_support_grants.sql:ro
    networks:
      - card_net
      - haeon_lab_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      lab.role: "haeon-card-database"
      lab.note: "Internal only; synthetic data and HAEON CARD schema"

  bookwave-mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${BOOKWAVE_DB_ROOT_PASSWORD:-root_bookwave_lab_only}
      MYSQL_DATABASE: ${BOOKWAVE_DB_NAME:-bookwave}
      MYSQL_USER: ${BOOKWAVE_DB_USER:-bookwave_app}
      MYSQL_PASSWORD: ${BOOKWAVE_DB_PASSWORD:-bookwave_app_lab_only}
      TZ: UTC
    volumes:
      - bookwave_mysql_data:/var/lib/mysql
    networks:
      - bookwave_db_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      lab.role: "bookwave-database"
      lab.note: "Separate owner database; no direct access from haeon-card"

  evidence:
    image: busybox:1.36
    restart: unless-stopped
    command: ["sh", "-c", "mkdir -p /evidence; touch /evidence/.ready; while :; do sleep 3600; done"]
    volumes:
      - ./evidence:/evidence
    networks:
      - audit_net
    healthcheck:
      test: ["CMD-SHELL", "test -f /evidence/.ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      lab.role: "read-only-evidence-volume"
      lab.note: "Application code must not use this as a business database"

  haeon-merchant-support:
    build:
      context: ./services/haeon-merchant-support
    image: bookwave/haeon-merchant-support:lab
    restart: unless-stopped
    environment:
      SERVICE_NAME: haeon-merchant-support
      SERVER_PORT: 8091
      DB_HOST: haeon-card-mysql
      DB_NAME: ${HAEON_DB_NAME:-haeon_card}
      DB_USER: ${HAEON_LAB_DB_USER:-haeon_lab_support}
      DB_PASSWORD: ${HAEON_LAB_DB_PASSWORD:-haeon_lab_support_only}
      LAB_CONTROL_TOKEN: ${HAEON_LAB_CONTROL_TOKEN:-lab-control-token-2026}
      LAB_DIAGNOSTIC_PROFILE: ${HAEON_DIAGNOSTIC_PROFILE:-after}
      LAB_RECEIVER_URL: http://haeon-lab-receiver:8093/v1/ingest
    expose:
      - "8091"
    ports:
      - "127.0.0.1:${HAEON_LAB_CONTROL_PORT:-8092}:8091"
    networks:
      - card_portal_net
      - haeon_lab_net
    depends_on:
      haeon-card-mysql:
        condition: service_healthy
      haeon-lab-receiver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8091/actuator/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      lab.role: "haeon-merchant-diagnostic-and-simulation"
      lab.note: "Synthetic lab only; no arbitrary OS command execution"

  haeon-lab-receiver:
    build:
      context: ./services/haeon-lab-receiver
    image: bookwave/haeon-lab-receiver:lab
    restart: unless-stopped
    environment:
      RECEIVER_PORT: 8093
      RECEIVER_DATA_DIR: /data
    expose:
      - "8093"
    volumes:
      - ./evidence/receiver:/data
    networks:
      - haeon_lab_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8093/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      lab.role: "synthetic-exfiltration-receiver"
      lab.note: "Internal-only receiver; synthetic records only"

  haeon-lab-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HAEON_GATEWAY_PORT:-8090}:8090"
    volumes:
      - ./services/haeon-lab-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      haeon-card:
        condition: service_healthy
      haeon-merchant-support:
        condition: service_healthy
    networks:
      - card_portal_net
      - haeon_lab_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/actuator/health >/dev/null || wget -qO- http://127.0.0.1:8090/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      lab.role: "haeon-local-domain-gateway"
      lab.note: "Local-only virtual service entrypoint at haeon.localhost"

networks:
  front_net:
    name: bookwave_front_net
  dmz_net:
    name: bookwave_dmz_net
  bookwave_db_net:
    name: bookwave_db_net
    internal: true
  card_net:
    name: haeon_card_net
    internal: true
  # 회원 포털 공개 포트를 위한 경계다. haeon-card 외에는 어떤 컨테이너도 연결하지 않는다.
  card_portal_net:
    name: haeon_card_portal_net
  audit_net:
    name: lab_audit_net
    internal: true
  haeon_lab_net:
    name: haeon_lab_net
    internal: true

volumes:
  haeon_card_mysql_data:
    name: bookwave_haeon_card_mysql_data
  bookwave_mysql_data:
    name: bookwave_bookwave_mysql_data
